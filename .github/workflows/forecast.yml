name: Foil forecast

on:
  schedule:
    - cron: "0 17 * * *"   # 6am NZDT: phone alerts and classic dashboard
    - cron: "0 23 * * *"   # 12pm NZDT
  push:                     # publish the app straight away when anything changes
    branches: [main]
  workflow_dispatch:        # "Run workflow" button for an on-demand rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Build the app
        run: |
          mkdir -p site
          cp index.html style.css scoring.js app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png site/
          python -c "import yaml, json; json.dump(yaml.safe_load(open('config.yaml')), open('site/config.json', 'w'), indent=1)"
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" site/sw.js

      - name: Classic dashboard and phone alerts
        continue-on-error: true   # a forecast hiccup here never blocks the app
        run: python foil_forecast.py --out site/classic.html
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
